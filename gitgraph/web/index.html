<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GitGraph</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #1a1a1a;
    }
    h1 { margin-bottom: 0.1rem; }
    #repo-path { color: #666; font-size: 0.9rem; word-break: break-all; }
    #summary {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin: 1.5rem 0;
    }
    .stat {
      background: #f4f4f5;
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
      min-width: 120px;
    }
    .stat .value { font-size: 1.5rem; font-weight: 600; }
    .stat .label {
      font-size: 0.75rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    #error { color: #b00020; white-space: pre-wrap; }
    .note { color: #888; font-size: 0.85rem; }

    #graph {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      background: #fff;
    }
    #graph svg { display: block; }
    .edge-normal { fill: none; stroke: #9aa0a6; stroke-width: 1.5px; }
    .edge-merge { fill: none; stroke: #d97706; stroke-width: 1.5px; stroke-dasharray: 4 3; }
    .commit-node { fill: #2563eb; stroke: #fff; stroke-width: 1px; cursor: pointer; }
    .commit-node-hover { fill: #1d4ed8; r: 7; }
    #graph-note { color: #888; font-size: 0.85rem; }

    #tooltip {
      position: fixed;
      z-index: 10;
      max-width: 320px;
      background: #1a1a1a;
      color: #f4f4f5;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
      line-height: 1.4;
      pointer-events: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }
    #tooltip[hidden] { display: none; }
    .tooltip-subject { font-weight: 600; margin-bottom: 0.25rem; }
  </style>
</head>
<body>
  <h1>GitGraph</h1>
  <p id="repo-path">loading&hellip;</p>

  <div id="summary"></div>

  <h2>Commit graph</h2>
  <p id="graph-note" class="note" hidden></p>
  <div id="graph"></div>

  <p id="error"></p>

  <div id="tooltip" hidden></div>

  <script src="/vendor/d3.v7.min.js"></script>
  <script src="/app.js"></script>
  <script src="/graph.js"></script>
</body>
</html>

name: CI
# GitGraph — Verity hygiene gate (stack-agnostic) + the Python test suite.
# Honestly green: secret-scan + a structure check, no faked pass, plus a real
# pytest run now that the walking skeleton (Stage 1: commit-store extractor)
# has landed (the progressive gate — framework-spec §3).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read # gitleaks lists PR commits via the API on pull_request
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files present
        run: |
          for f in README.md LICENSE; do
            test -f "$f" || { echo "missing required file: $f"; exit 1; }
          done
          echo "structure ok"
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gitgraph (+ dev deps)
        run: pip install -e ".[dev]"
      - name: Configure git identity for fixture-repo tests
        run: |
          git config --global user.name "GitGraph CI"
          git config --global user.email "ci@gitgraph.local"
          git config --global init.defaultBranch main
      - name: Run test suite
        run: pytest -q

name: CI
# GitGraph — Verity hygiene gate (stack-agnostic) + the Python test suite.
# Honestly green: secret-scan + a structure check, no faked pass, plus a real
# pytest run, plus (Stage 2) an actual container build+run+curl — this is
# what ADR 0002 defines as GitGraph's local "deploy" bar for the walking
# skeleton (framework-spec §3).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read # gitleaks lists PR commits via the API on pull_request
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files present
        run: |
          for f in README.md LICENSE; do
            test -f "$f" || { echo "missing required file: $f"; exit 1; }
          done
          echo "structure ok"
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gitgraph (+ dev deps)
        run: pip install -e ".[dev]"
      - name: Configure git identity for fixture-repo tests
        run: |
          git config --global user.name "GitGraph CI"
          git config --global user.email "ci@gitgraph.local"
          git config --global init.defaultBranch main
      - name: Run test suite
        run: pytest -q
  docker:
    # ADR 0002: GitGraph's local "deploy" bar is "container builds and runs
    # locally, gitgraph serve reachable". This job builds the image, runs
    # `gitgraph analyze` against this repo to get real data for the
    # container to serve, starts the container, and curls /api/summary.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gitgraph to produce fixture data for the container
        run: pip install -e .
      - name: Configure git identity (gitgraph analyze needs one for git log)
        run: |
          git config --global user.name "GitGraph CI"
          git config --global user.email "ci@gitgraph.local"
      - name: Analyze this repo into a db for the container to serve
        run: |
          mkdir -p ci-data
          gitgraph analyze . --db ci-data/gitgraph.db
      - name: Build Docker image
        run: docker build -t gitgraph:ci .
      - name: Run container serving the analyzed db
        run: |
          docker run -d --name gitgraph-ci \
            -v "$PWD/ci-data:/data" \
            -e GITGRAPH_DB=/data/gitgraph.db \
            gitgraph:ci
      - name: Curl /api/summary from inside the container
        # gitgraph serve binds 127.0.0.1 only (ADR 0002) inside its own
        # network namespace, so standard `-p` host port publishing can't
        # reach it — `docker exec` runs in the same namespace and can.
        run: |
          for i in $(seq 1 30); do
            if docker exec gitgraph-ci curl -sf http://127.0.0.1:8000/api/summary > summary.json; then
              echo "server responded"
              break
            fi
            sleep 1
          done
          echo "--- /api/summary response ---"
          cat summary.json
          python3 -c "
          import json
          with open('summary.json') as f:
              data = json.load(f)
          assert data.get('commit_count', 0) > 0, f'expected commit_count > 0, got {data}'
          print('commit_count:', data['commit_count'])
          "
      - name: Container logs
        if: always()
        run: docker logs gitgraph-ci || true
      - name: Cleanup
        if: always()
        run: docker rm -f gitgraph-ci || true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitgraph"
version = "0.1.0"
description = "Turns a Git repository's commit history into a queryable SQLite commit-store."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
gitgraph = "gitgraph.cli:main"

[tool.setuptools.packages.find]
include = ["gitgraph*"]

[tool.setuptools.package-data]
gitgraph = ["web/*.html", "web/*.js"]
